services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 5s
      retries: 30

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://app:app@db:5432/app
      PORT: "3000"
      # Required. Compose fails fast with this message if it is unset.
      APP_LICENCE_KEY: ${APP_LICENCE_KEY:?APP_LICENCE_KEY is not set}
    ports:
      - "3000:3000"

volumes:
  db-data:
